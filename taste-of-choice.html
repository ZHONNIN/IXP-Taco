<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Taste of Choice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }

        section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease, transform 1s ease;
            padding: 20px;
        }

        section.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        section.hidden {
            opacity: 0;
            transform: translateY(-50px);
        }

        /* Intro Scene */
        #intro {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 50%, #ff9ff3 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .intro-content {
            text-align: center;
            animation: fadeInUp 1.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.5rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 50px;
            font-style: italic;
        }

        button {
            padding: 18px 45px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ee5a6f 0%, #f29263 100%);
            color: white;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        button:active {
            transform: translateY(-1px) scale(1.02);
        }

        /* Customer Scene */
        #customers {
            background: linear-gradient(135deg, #2d3561 0%, #1f2544 100%);
            transition: background 0.8s ease;
        }

        .customer-container {
            max-width: 900px;
            width: 100%;
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .customer-name {
            font-size: 1.8rem;
            color: #ee5a6f;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 700;
        }

        .dialogue-box {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            min-height: 120px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        .dialogue-box::before {
            content: '"';
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 3rem;
            color: rgba(0,0,0,0.1);
            font-family: Georgia, serif;
        }

        .dialogue-text {
            font-size: 1.3rem;
            color: #2d3436;
            line-height: 1.6;
            font-weight: 500;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .choice-btn {
            padding: 20px 30px;
            font-size: 1.1rem;
            border-radius: 15px;
            background: linear-gradient(135deg, #74b9ff 0%, #a29bfe 100%);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .choice-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .choice-btn:hover::before {
            left: 100%;
        }

        .choice-btn:nth-child(2) {
            background: linear-gradient(135deg, #fd79a8 0%, #fdcb6e 100%);
        }

        .choice-btn:nth-child(3) {
            background: linear-gradient(135deg, #00b894 0%, #55efc4 100%);
        }

        .round-indicator {
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #636e72;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Outcome Scene */
        #outcome {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .outcome-content {
            text-align: center;
            max-width: 800px;
            animation: fadeInUp 1.5s ease;
        }

        .outcome-text {
            font-size: 1.8rem;
            color: white;
            line-height: 2;
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .taco-illustration {
            font-size: 8rem;
            margin-bottom: 50px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(255,255,255,0.5),
                             0 0 40px rgba(255,255,255,0.3);
            }
            50% {
                text-shadow: 0 0 30px rgba(255,255,255,0.8),
                             0 0 60px rgba(255,255,255,0.5);
            }
        }

        /* Background mood changes */
        .mood-warm {
            background: linear-gradient(135deg, #ff9a56 0%, #ffb088 100%) !important;
        }

        .mood-calm {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%) !important;
        }

        .mood-playful {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%) !important;
        }

        .mood-nostalgic {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%) !important;
        }

        .mood-creative {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%) !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            .subtitle {
                font-size: 1.2rem;
            }
            .customer-container {
                padding: 30px;
            }
            .dialogue-text {
                font-size: 1.1rem;
            }
            .choice-btn {
                font-size: 1rem;
                padding: 15px 20px;
            }
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Fade effect for text */
        .typing {
            overflow: hidden;
            white-space: pre-wrap;
            display: inline;
        }
    </style>
</head>
<body>
    <!-- Intro Scene -->
    <section id="intro" class="active">
        <div class="intro-content">
            <h1>The Taste of Choice</h1>
            <p class="subtitle">Every flavor tells a story.</p>
            <button onclick="startGame()">Start Your Taco Stand</button>
        </div>
    </section>

    <!-- Customer Scene -->
    <section id="customers">
        <div class="customer-container">
            <div class="customer-name" id="customerName"></div>
            <div class="round-indicator" id="roundIndicator"></div>
            <div class="dialogue-box">
                <div class="dialogue-text" id="dialogueText"></div>
            </div>
            <div class="choices" id="choices"></div>
        </div>
    </section>

    <!-- Outcome Scene -->
    <section id="outcome">
        <div class="outcome-content">
            <div class="taco-illustration">🌮</div>
            <div class="outcome-text">
                You've served three different souls tonight.<br>
                Every choice changed a mood.<br>
                Every flavor told a story.
            </div>
            <button onclick="restartGame()">Restart the Night</button>
        </div>
    </section>

    <!-- Audio Elements -->
    <audio id="ambientSound" loop>
        <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
    </audio>

    <script>
        // Game State
        let currentCustomerIndex = 0;
        let currentRound = 0;
        let isTyping = false;

        // Customer Data
        const customers = [
            {
                name: "The Overworked Office Worker",
                intro: "A tired man in a suit walks up to your stand.\nHe says: \"It's been a long day… maybe food will help me breathe again.\"",
                reactions: {
                    communication: [
                        "Thanks… feels nice to be noticed after a long day.",
                        "I appreciate the quiet. No small talk for once.",
                        "Haha, didn't expect to laugh tonight."
                    ],
                    ingredients: [
                        "This is comfort. Like home after overtime.",
                        "Whoa! That actually woke me up.",
                        "Pineapple? That's… surprisingly good."
                    ],
                    presentation: [
                        "You even plated it nicely. That's care.",
                        "Perfect. I'll eat this while heading back.",
                        "Didn't expect street food to look this cheerful."
                    ]
                },
                moods: ['mood-warm', 'mood-calm', 'mood-playful']
            },
            {
                name: "The Immigrant Woman",
                intro: "A woman carrying a small suitcase stops by.\nShe says: \"Your food smells familiar… but the city feels so new.\"",
                reactions: {
                    communication: [
                        "You make me feel like I belong here.",
                        "Polite and kind — like a safe harbor.",
                        "Haha, maybe laughter sounds the same in every language."
                    ],
                    ingredients: [
                        "This taste… it brings back memories of home.",
                        "Strong and fiery — like starting a new life.",
                        "It's like two places meeting in one bite."
                    ],
                    presentation: [
                        "It feels personal — like something made for me.",
                        "I'll take it on my walk — my journey continues.",
                        "So vibrant… like the markets I miss."
                    ]
                },
                moods: ['mood-nostalgic', 'mood-calm', 'mood-warm']
            },
            {
                name: "The Art Student",
                intro: "A quiet young artist with paint on her hands appears.\nShe says: \"I'm searching for inspiration… maybe flavor can spark it.\"",
                reactions: {
                    communication: [
                        "Your energy feels… like a sunrise after an all-nighter.",
                        "I like how you give space. Inspiration needs silence.",
                        "Haha, you're playful — that's rare in serious artists."
                    ],
                    ingredients: [
                        "Simple. Honest. Like a clean canvas.",
                        "Bold! That's passion in edible form.",
                        "Fusion… chaos… I love it."
                    ],
                    presentation: [
                        "It's like edible art.",
                        "Casual, fleeting — like street sketches.",
                        "Color! You understand aesthetics!"
                    ]
                },
                moods: ['mood-creative', 'mood-calm', 'mood-playful']
            }
        ];

        // Round choices
        const rounds = [
            {
                name: "Communication Style",
                choices: [
                    "Warm welcome",
                    "Respectful distance",
                    "Light humor"
                ]
            },
            {
                name: "Ingredients",
                choices: [
                    "Traditional taco (soft beef & onion)",
                    "Spicy taco (extra chili)",
                    "Experimental taco (fusion with pineapple)"
                ]
            },
            {
                name: "Presentation",
                choices: [
                    "Handmade plate",
                    "Paper wrap",
                    "Bright colored garnish"
                ]
            }
        ];

        // Sound Effects
        function playSound(type) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            if (type === 'click') {
                oscillator.frequency.value = 800;
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } else if (type === 'transition') {
                oscillator.frequency.value = 400;
                gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            }
        }

        // Typing Effect
        function typeText(element, text, speed = 30) {
            return new Promise((resolve) => {
                isTyping = true;
                element.textContent = '';
                let index = 0;

                const type = () => {
                    if (index < text.length) {
                        element.textContent += text.charAt(index);
                        index++;
                        setTimeout(type, speed);
                    } else {
                        isTyping = false;
                        resolve();
                    }
                };

                type();
            });
        }

        // Scene Transitions
        function showScene(sceneId) {
            const sections = document.querySelectorAll('section');
            sections.forEach(section => {
                section.classList.remove('active');
                section.classList.add('hidden');
            });

            setTimeout(() => {
                const targetSection = document.getElementById(sceneId);
                targetSection.classList.remove('hidden');
                targetSection.classList.add('active');
                playSound('transition');
            }, 300);
        }

        // Start Game
        function startGame() {
            playSound('click');
            currentCustomerIndex = 0;
            currentRound = 0;
            showScene('customers');
            setTimeout(() => {
                loadCustomer();
            }, 500);
        }

        // Load Customer
        async function loadCustomer() {
            if (currentCustomerIndex >= customers.length) {
                setTimeout(() => {
                    showScene('outcome');
                }, 1000);
                return;
            }

            const customer = customers[currentCustomerIndex];
            currentRound = 0;

            document.getElementById('customerName').textContent = customer.name;
            document.getElementById('roundIndicator').textContent = 'Introduction';

            const dialogueText = document.getElementById('dialogueText');
            await typeText(dialogueText, customer.intro);

            setTimeout(() => {
                showRound();
            }, 1000);
        }

        // Show Round
        async function showRound() {
            if (currentRound >= rounds.length) {
                currentCustomerIndex++;
                setTimeout(() => {
                    loadCustomer();
                }, 1500);
                return;
            }

            const round = rounds[currentRound];
            const roundIndicator = document.getElementById('roundIndicator');
            roundIndicator.textContent = `Round ${currentRound + 1}: ${round.name}`;

            const choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = '';

            round.choices.forEach((choice, index) => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = choice;
                button.onclick = () => makeChoice(index);
                choicesContainer.appendChild(button);
            });
        }

        // Make Choice
        async function makeChoice(choiceIndex) {
            if (isTyping) return;

            playSound('click');

            const customer = customers[currentCustomerIndex];
            const choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = '';

            // Get reaction based on round
            let reaction = '';
            let moodClass = '';

            if (currentRound === 0) {
                reaction = customer.reactions.communication[choiceIndex];
            } else if (currentRound === 1) {
                reaction = customer.reactions.ingredients[choiceIndex];
            } else if (currentRound === 2) {
                reaction = customer.reactions.presentation[choiceIndex];
            }

            moodClass = customer.moods[choiceIndex] || customer.moods[0];

            // Apply mood
            const customersSection = document.getElementById('customers');
            customersSection.className = moodClass;

            // Show reaction
            const dialogueText = document.getElementById('dialogueText');
            await typeText(dialogueText, reaction);

            currentRound++;

            setTimeout(() => {
                showRound();
            }, 1500);
        }

        // Restart Game
        function restartGame() {
            playSound('click');
            currentCustomerIndex = 0;
            currentRound = 0;

            const customersSection = document.getElementById('customers');
            customersSection.className = '';

            showScene('intro');
        }

        // Initialize ambient sound
        window.addEventListener('load', () => {
            const ambientSound = document.getElementById('ambientSound');
            ambientSound.volume = 0.1;

            // Try to play ambient sound on first user interaction
            document.body.addEventListener('click', () => {
                ambientSound.play().catch(() => {});
            }, { once: true });
        });
    </script>
</body>
</html>
